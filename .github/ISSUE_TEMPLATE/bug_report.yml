name: Bug report
description: Report a reproducible problem with Codex Usage Menu Bar
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove account details, tokens, prompt content, and private logs before submitting.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.5
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: ChatGPT/Codex version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
